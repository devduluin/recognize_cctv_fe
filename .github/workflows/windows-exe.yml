name: Build Windows EXE
run-name: Windows EXE · ${{ github.ref_name }} · run ${{ github.run_number }}

on:
  workflow_dispatch:
    inputs:
      backend_ref:
        description: Backend commit SHA (40 characters; empty uses desktop.config.json)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: windows-exe-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Resolve pinned build configuration
    runs-on: ubuntu-24.04
    outputs:
      backend_ref: ${{ steps.config.outputs.backend_ref }}
      backend_repo: ${{ steps.config.outputs.backend_repo }}
      node_version: ${{ steps.config.outputs.node_version }}
      python_version: ${{ steps.config.outputs.python_version }}
      version: ${{ steps.config.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Read and validate build inputs
        id: config
        env:
          BACKEND_REF_INPUT: ${{ inputs.backend_ref }}
        run: |
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          config = json.loads(Path('desktop.config.json').read_text())
          version = json.loads(Path('package.json').read_text())['version']
          ref = os.environ.get('BACKEND_REF_INPUT', '').strip() or config['backendRef']
          assert re.fullmatch(r'\d+\.\d+\.\d+', version), 'Invalid desktop version'
          assert re.fullmatch(r'[0-9a-f]{40}', ref), 'Use the full backend commit SHA, not a branch or tag'
          assert re.fullmatch(r'[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+', config['backendRepository']), 'Invalid backend repository'
          for key in ('nodeVersion', 'pythonVersion'):
              assert re.fullmatch(r'\d+\.\d+\.\d+', config[key]), f'{key} must be pinned'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              for key, value in {'backend_ref': ref, 'backend_repo': config['backendRepository'],
                                 'node_version': config['nodeVersion'], 'python_version': config['pythonVersion'],
                                 'version': version}.items():
                  output.write(f'{key}={value}\n')
          PY

  build:
    name: Windows x64 installer
    needs: prepare
    runs-on: windows-2025
    timeout-minutes: 120
    environment: desktop-development
    defaults:
      run:
        shell: bash
    env:
      DESKTOP_RELEASE: 'false'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Checkout frontend
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: frontend
          persist-credentials: false
      - name: Checkout pinned backend
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ needs.prepare.outputs.backend_repo }}
          ref: ${{ needs.prepare.outputs.backend_ref }}
          path: recognize_cctv
          token: ${{ secrets.DESKTOP_SOURCE_TOKEN || github.token }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ needs.prepare.outputs.node_version }}
          architecture: x64
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ needs.prepare.outputs.python_version }}
          architecture: x64
      - name: Install pinned Python package manager
        id: uv
        run: |
          python -m pip install uv==0.9.5
          python - <<'PY'
          import os, subprocess
          cache = subprocess.check_output(['uv', 'cache', 'dir'], text=True).strip()
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'cache={cache}\n')
          PY
      - uses: actions/cache@v4
        with:
          path: |
            ${{ steps.uv.outputs.cache }}
            frontend/desktop-cache
          key: windows-exe-x64-${{ needs.prepare.outputs.node_version }}-${{ needs.prepare.outputs.python_version }}-${{ hashFiles('recognize_cctv/desktop/uv.lock', 'frontend/desktop-assets.lock.json') }}
      - name: Verify backend source and install locked dependencies
        working-directory: recognize_cctv
        env:
          EXPECTED_BACKEND_REF: ${{ needs.prepare.outputs.backend_ref }}
        run: |
          python - <<'PY'
          import os, pathlib, struct, subprocess
          assert os.name == 'nt' and struct.calcsize('P') == 8, 'Windows x64 Python is required'
          assert pathlib.Path('desktop_backend.py').is_file(), 'Missing desktop backend entry point'
          assert subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip() == os.environ['EXPECTED_BACKEND_REF'], 'Backend SHA mismatch'
          PY
          uv sync --project desktop --locked
          python - <<'PY'
          import os, pathlib
          root = pathlib.Path.cwd()
          executable = root / 'desktop/.venv/Scripts/python.exe'
          assert executable.is_file(), 'Backend Python environment was not created'
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write(f'DESKTOP_PYTHON={executable}\nDESKTOP_BACKEND_ROOT={root}\n')
          PY
      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Validate backend
        working-directory: recognize_cctv
        env:
          DB_TYPE: postgresql
          DB_HOST: 127.0.0.1
          DB_PORT: '5432'
          DB_USERNAME: visitor
          DB_NAME: visitor_test
          IS_PRODUCTION: 'false'
        run: '"$DESKTOP_PYTHON" -m pytest -q tests'
      - name: Validate frontend and desktop lifecycle
        working-directory: frontend
        run: |
          npm run lint
          npm test
          npm run typecheck
          npm run desktop:test
      - name: Build Windows backend, bundled runtimes and Next.js standalone
        working-directory: frontend
        run: npm run desktop:build
      - name: Package development NSIS installer
        working-directory: frontend
        run: npm run desktop:package -- --win --x64
      - name: Launch packaged app and verify restart persistence
        working-directory: frontend
        run: node scripts/desktop/packaged-smoke.cjs
      - name: Install EXE in an isolated test directory
        shell: pwsh
        working-directory: frontend
        run: |
          $ErrorActionPreference = 'Stop'
          $installers = @(Get-ChildItem dist-desktop -Filter '*.exe' -File)
          if ($installers.Count -ne 1) { throw 'Expected exactly one Windows installer' }
          $destination = Join-Path $env:RUNNER_TEMP 'visitor-counter-installer-test'
          $installer = Start-Process -FilePath $installers[0].FullName -ArgumentList @('/S', "/D=$destination") -Wait -PassThru
          if ($installer.ExitCode -ne 0) { throw "Installer failed with exit code $($installer.ExitCode)" }
          $executable = Join-Path $destination 'Visitor Counter.exe'
          if (-not (Test-Path -LiteralPath $executable -PathType Leaf)) { throw 'Installed application was not found' }
          node scripts/desktop/packaged-smoke.cjs --executable $executable
          if ($LASTEXITCODE -ne 0) { throw 'Installed application smoke test failed' }
      - name: Verify installer provenance and write checksums
        working-directory: frontend
        env:
          EXPECTED_BACKEND_REF: ${{ needs.prepare.outputs.backend_ref }}
          EXPECTED_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          python - <<'PY'
          import hashlib, json, os, pathlib, shutil, subprocess
          output = pathlib.Path('dist-desktop')
          installers = list(output.glob('*.exe'))
          assert len(installers) == 1, 'Expected one EXE installer'
          with installers[0].open('rb') as executable:
              assert executable.read(2) == b'MZ', 'Installer is not a Windows executable'
          manifest = json.loads(pathlib.Path('resources/build-manifest.json').read_text())
          assert manifest['platform'] == 'win32' and manifest['arch'] == 'x64', 'Wrong target platform'
          assert manifest['version'] == os.environ['EXPECTED_VERSION'], 'Version mismatch'
          assert manifest['backendRevision'] == os.environ['EXPECTED_BACKEND_REF'], 'Wrong backend bundled'
          assert manifest['frontendRevision'] == subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(), 'Wrong frontend bundled'
          shutil.copyfile('resources/build-manifest.json', output / 'build-manifest.json')
          files = sorted(installers + list(output.glob('*.blockmap')) + list(output.glob('latest*.yml')) + [output / 'build-manifest.json'])
          with (output / 'SHA256SUMS.txt').open('w', encoding='utf-8') as checksums:
              for file in files:
                  with file.open('rb') as source:
                      digest = hashlib.file_digest(source, 'sha256').hexdigest()
                  checksums.write(f'{digest}  {file.name}\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write(f"## Windows x64 build {manifest['version']}\n\n")
              summary.write('Development installer; not an official signed release.\n\n')
              summary.write(f"Backend: `{manifest['backendRevision']}`\n\nFrontend: `{manifest['frontendRevision']}`\n\n")
              summary.write('Packaged and installed app startup/restart checks passed. Download the EXE from this run’s artifact.\n')
          PY
      - name: Upload Windows installer
        uses: actions/upload-artifact@v7
        with:
          name: windows-exe-x64-${{ needs.prepare.outputs.version }}-${{ github.run_number }}
          path: |
            frontend/dist-desktop/*.exe
            frontend/dist-desktop/*.blockmap
            frontend/dist-desktop/latest*.yml
            frontend/dist-desktop/build-manifest.json
            frontend/dist-desktop/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
