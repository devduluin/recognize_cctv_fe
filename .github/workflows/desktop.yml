name: Tauri native validation
on:
  workflow_dispatch:
    inputs:
      backend_ref:
        description: Backend commit SHA (empty uses desktop.config.json)
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: tauri-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-2025, arch: x64}
          - {os: macos-15, arch: arm64}
          - {os: macos-15-intel, arch: x64}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: frontend
          persist-credentials: false
      - id: config
        name: Read pinned configuration
        env:
          BACKEND_REF_INPUT: ${{ inputs.backend_ref }}
        run: |
          node - <<'JS'
          const fs = require('node:fs');
          const config = require('./desktop.config.json');
          const ref = process.env.BACKEND_REF_INPUT || config.backendRef;
          if (!/^[0-9a-f]{40}$/.test(ref)) throw new Error('Full backend commit SHA required');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `backend_repo=${config.backendRepository}\nbackend_ref=${ref}\nnode=${config.nodeVersion}\npython=${config.pythonVersion}\n`);
          JS
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ steps.config.outputs.backend_repo }}
          ref: ${{ steps.config.outputs.backend_ref }}
          path: recognize_cctv
          token: ${{ secrets.DESKTOP_SOURCE_TOKEN || github.token }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ steps.config.outputs.node }}
          architecture: ${{ matrix.arch }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ steps.config.outputs.python }}
          architecture: ${{ matrix.arch }}
      - name: Install locked frontend dependencies
        run: npm ci
      - name: Prepare locked Python environment
        working-directory: recognize_cctv
        run: |
          python -m pip install uv==0.9.5
          uv sync --project desktop --locked
      - name: Install Rust CLI
        run: |
          rustup update stable
          rustup default stable
          cargo install tauri-cli --version '^2' --locked
      - name: Validate web and desktop host
        run: |
          npm test
          npm run desktop:test
          npm run docs:check
      - name: Build local resources
        run: npm run desktop:resources
      - name: Resolve initial native lockfile
        run: |
          if [ ! -f src-tauri/Cargo.lock ]; then
            echo 'Initial development lockfile: review and commit before enabling releases.'
            cargo generate-lockfile --manifest-path src-tauri/Cargo.toml
          fi
      - name: Validate native host (no installer or release publication)
        run: cargo tauri build --no-bundle -- --locked
      - uses: actions/upload-artifact@v4
        with:
          name: tauri-native-validation-${{ matrix.os }}-${{ matrix.arch }}
          path: frontend/src-tauri/Cargo.lock
          if-no-files-found: error
