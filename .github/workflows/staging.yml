name: Production readiness and deploy
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: visitor-frontend-${{ github.ref }}
  cancel-in-progress: false
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build -- --webpack
        env:
          NEXT_PUBLIC_SERVICE_RECOGNIZE_CCTV: https://api.example.com
          NEXT_PUBLIC_APP_MODE: multi_tenant
      - name: Build production image
        run: docker build --build-arg NEXT_PUBLIC_SERVICE_RECOGNIZE_CCTV=https://api.example.com --build-arg NEXT_PUBLIC_APP_MODE=multi_tenant -t recognize-cctv-fe-ci .
      - name: Validate Compose
        run: ENV_FILE=.env.example docker compose --env-file .env.example config --quiet
  deploy:
    if: github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify SSH host and install deploy key
        env:
          SSH_HOST: ${{ secrets.SSH_HOST_DEV_NEW }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_FINGERPRINT: ${{ secrets.SSH_FINGERPRINT }}
        run: |
          set -euo pipefail
          test -n "$SSH_FINGERPRINT"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -T 10 -t ed25519 "$SSH_HOST" > ~/.ssh/known_hosts
          actual=$(ssh-keygen -lf ~/.ssh/known_hosts -E sha256 | awk '{print $2}')
          test "$actual" = "$SSH_FINGERPRINT"
      - name: Upload isolated release and deploy
        env:
          SSH_HOST: ${{ secrets.SSH_HOST_DEV_NEW }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          set -euo pipefail
          [[ "$SSH_USER" =~ ^[a-zA-Z0-9_-]+$ ]]
          [[ "$SSH_HOST" =~ ^[a-zA-Z0-9.-]+$ ]]
          release="/home/apps/machine-learning/releases/frontend/$GITHUB_SHA"
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" "mkdir -p '$release'"
          git archive HEAD | ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" "tar -x -C '$release'"
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" "bash '$release/tools/deploy_production.sh' '$release' '/home/apps/machine-learning/shared/.env.fe' '$GITHUB_SHA'"
      - name: Remove temporary SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
