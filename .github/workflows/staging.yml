name: Build and Deploy Frontend

on:
  workflow_dispatch:

concurrency:
  group: machine-learning-fe-staging-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Check SSH Port
        run: |
          echo "Checking SSH connectivity..."
          timeout 15 bash -c "</dev/tcp/${{ secrets.SSH_HOST_DEV_NEW }}/22" \
            && echo "Port 22 OPEN"

      - name: Copy files to server
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST_DEV_NEW }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: ".,!.git,!node_modules,!.next,!.env,!.env.*"
          target: "/home/apps/machine-learning/machine-learning-fe"
          overwrite: true
          rm: false

      - name: Build and Restart Docker on Server
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SSH_HOST_DEV_NEW }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          command_timeout: 30m
          script: |
            set -e

            cd /home/apps/machine-learning/machine-learning-fe

            SHARED_DIR="/home/apps/machine-learning/shared"
            SHARED_ENV="$SHARED_DIR/.env.fe"

            mkdir -p "$SHARED_DIR"

            if [ ! -f "$SHARED_ENV" ]; then
              echo "Shared environment file $SHARED_ENV not found. Creating automatically from template..."
              if [ -f "environment/.env.example" ]; then
                cp "environment/.env.example" "$SHARED_ENV"
              elif [ -f "environment/.env.production" ]; then
                cp "environment/.env.production" "$SHARED_ENV"
              elif [ -f "environment/.env.staging" ]; then
                cp "environment/.env.staging" "$SHARED_ENV"
              elif [ -f ".env.example" ]; then
                cp ".env.example" "$SHARED_ENV"
              elif [ -f ".env" ]; then
                cp ".env" "$SHARED_ENV"
              else
                echo "ERROR: No template env file found to create $SHARED_ENV."
                exit 1
              fi
              echo "Successfully initialized $SHARED_ENV from template."
            else
              echo "Using existing shared env file: $SHARED_ENV"
            fi

            mkdir -p environment
            ln -sf "$SHARED_ENV" .env
            ln -sf "$SHARED_ENV" environment/.env.staging
            ln -sf "$SHARED_ENV" environment/.env.production
            ENV_FILE="$SHARED_ENV"

            echo "Current directory:"
            pwd

            echo "Docker Compose version:"
            docker compose version

            echo "Building and starting containers..."
            docker compose --env-file "$ENV_FILE" up -d --build

            echo "Container status:"
            docker compose --env-file "$ENV_FILE" ps

            echo "Checking frontend health..."
            curl --fail --silent --show-error --retry 10 --retry-all-errors \
              --retry-delay 3 --max-time 10 \
              http://127.0.0.1:8005/

            echo "Deployment completed."
