name: Production readiness and deploy
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: visitor-frontend-${{ github.ref }}
  cancel-in-progress: false
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npx tsc --noEmit
      - run: npm run build -- --webpack
        env:
          NEXT_PUBLIC_SERVICE_RECOGNIZE_CCTV: https://api.example.com
          NEXT_PUBLIC_APP_MODE: multi_tenant
      - name: Build production image
        run: docker build --build-arg NEXT_PUBLIC_SERVICE_RECOGNIZE_CCTV=https://api.example.com --build-arg NEXT_PUBLIC_APP_MODE=multi_tenant -t recognize-cctv-fe-ci .
      - name: Validate Compose
        run: ENV_FILE=.env.example docker compose --env-file .env.example config --quiet
  deploy:
    if: github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prepare SSH host key and deploy key
        env:
          SSH_HOST_DEV_NEW: ${{ secrets.SSH_HOST_DEV_NEW }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          set -euo pipefail
          for required in SSH_HOST_DEV_NEW SSH_USER SSH_KEY; do
            if [[ -z "${!required:-}" ]]; then
              echo "::error::Secret $required belum tersedia. Atur di repository atau environment production."
              exit 1
            fi
          done
          [[ "$SSH_HOST_DEV_NEW" =~ ^[a-zA-Z0-9.-]+$ && "$SSH_HOST_DEV_NEW" != -* ]] || { echo "::error::Format SSH_HOST_DEV_NEW tidak valid."; exit 1; }
          [[ "$SSH_USER" =~ ^[a-zA-Z0-9_-]+$ ]] || { echo "::error::Format SSH_USER tidak valid."; exit 1; }
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -T 10 -t ed25519 "$SSH_HOST_DEV_NEW" > ~/.ssh/known_hosts
          if [[ ! -s ~/.ssh/known_hosts ]]; then
            echo "::error::Host key SSH tidak tersedia. Periksa alamat server dan akses port 22."
            exit 1
          fi
      - name: Upload isolated release and deploy
        env:
          SSH_HOST_DEV_NEW: ${{ secrets.SSH_HOST_DEV_NEW }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          set -euo pipefail
          [[ "$SSH_USER" =~ ^[a-zA-Z0-9_-]+$ ]]
          [[ "$SSH_HOST_DEV_NEW" =~ ^[a-zA-Z0-9.-]+$ ]]
          release="/home/apps/machine-learning/releases/frontend/$GITHUB_SHA"
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST_DEV_NEW" "mkdir -p '$release'"
          git archive HEAD | ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST_DEV_NEW" "tar -x -C '$release'"
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST_DEV_NEW" "bash '$release/tools/deploy_production.sh' '$release' '/home/apps/machine-learning/shared/.env.fe' '$GITHUB_SHA'"
      - name: Remove temporary SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
