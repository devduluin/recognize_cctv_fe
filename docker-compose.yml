name: recognize-cctv-fe

services:
  recognize_cctv_fe:
    container_name: recognize_cctv_fe
    image: ${RELEASE_IMAGE:-recognize_cctv_fe:local}
    init: true
    stop_grace_period: 30s
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    build:
      context: .
      args:
        NEXT_PUBLIC_APP_MODE: ${NEXT_PUBLIC_APP_MODE}
        NEXT_PUBLIC_SERVICE_RECOGNIZE_CCTV: ${NEXT_PUBLIC_SERVICE_RECOGNIZE_CCTV}
        IS_MAINTANANCE: ${IS_MAINTANANCE:-false}
    restart: unless-stopped
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    ports:
      - "127.0.0.1:8005:8005"
    env_file:
      - ${ENV_FILE:-.env}
    environment:
      - NODE_ENV=production
    healthcheck:
      test:
        ["CMD-SHELL", "wget --spider --quiet http://127.0.0.1:8005/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      - recognize_cctv_fe_network
      - nginx-proxy-manager_default

networks:
  recognize_cctv_fe_network:
  nginx-proxy-manager_default:
    external: true
    name: nginx-proxy-manager_default
