services:
  machine-learning-fe:
    container_name: machine-learning-fe
    build:
      context: .
      args:
        NEXT_PUBLIC_APP_MODE: ${NEXT_PUBLIC_APP_MODE}
        NEXT_PUBLIC_SERVICE_RECOGNIZE_CCTV: ${NEXT_PUBLIC_SERVICE_RECOGNIZE_CCTV}
    restart: always
    ports:
      - "8005:8005"
    env_file:
      - ./environment/.env.staging
    environment:
      - NODE_ENV=production
    healthcheck:
      test:
        ["CMD-SHELL", "wget --spider --quiet http://127.0.0.1:8005/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      - machine_learning_fe_network
      - nginx-proxy-manager_default

networks:
  machine_learning_fe_network:
  nginx-proxy-manager_default:
    external: true
    name: nginx-proxy-manager_default
