<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Visitor Counter</title>
<style>
:root{color-scheme:light;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#183042;background:#f5f8fa}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:32px}main{width:min(100%,420px)}.brand{display:flex;align-items:center;gap:18px;margin-bottom:42px}.brand img{width:76px;height:76px;object-fit:contain}h1{font-size:28px;letter-spacing:-1px;margin:0 0 7px;font-weight:650}.subtitle{margin:0;color:#607583;font-size:14px}h2{font-size:17px;font-weight:600;margin:0 0 10px}.description{font-size:14px;color:#607583;line-height:1.6;margin:0;min-height:45px}.track{height:3px;background:#dce6eb;margin:25px 0;overflow:hidden;border-radius:4px}.track span{display:block;height:100%;width:35%;background:#168ca2;animation:scan 1.8s ease-in-out infinite}.steps{display:flex;justify-content:space-between;gap:12px;padding:0;list-style:none;font-size:12px;color:#6b7e8a}.steps li{display:flex;align-items:center;gap:7px}.dot{width:6px;height:6px;border:1px solid #9bb0bd;border-radius:50%}.active{color:#176f81}.active .dot,.done .dot{background:#168ca2;border-color:#168ca2}.footer{border-top:1px solid #dce6eb;margin-top:32px;padding-top:18px;font-size:12px;color:#6b7e8a;display:flex;justify-content:space-between;gap:16px}.failed .track span{animation:none;width:100%;background:#b95443}.failed h2{color:#a83c2b}.failed .steps{display:none}@keyframes scan{0%{transform:translateX(-110%)}100%{transform:translateX(390%)}}@media(prefers-reduced-motion:reduce){.track span{animation:none;width:100%;opacity:.65}}@media(max-width:420px){body{padding:24px}.brand{gap:12px}h1{font-size:24px}.steps{gap:5px;font-size:11px}}
</style>
</head>
<body>
<main id="startup" aria-busy="true">
<div class="brand"><img src="icon.png" alt="" width="76" height="76"><div><h1>Visitor Counter</h1><p class="subtitle">Computer vision untuk setiap kunjungan.</p></div></div>
<section aria-live="polite" aria-atomic="true"><h2 id="status">Menyiapkan aplikasi</h2><p class="description" id="description">Memeriksa penyimpanan dan menyiapkan layanan di perangkat Anda.</p></section>
<div class="track" role="progressbar" aria-label="Menyiapkan Visitor Counter"><span></span></div>
<ul class="steps" aria-label="Tahap penyiapan"><li id="step-services" class="active"><span class="dot"></span>Layanan lokal</li><li id="step-session"><span class="dot"></span>Sesi pengguna</li><li id="step-interface"><span class="dot"></span>Ruang kerja</li></ul>
<div class="footer"><span id="hint">Data Anda tetap tersimpan di perangkat.</span><span id="elapsed">0 detik</span></div>
</main>
<script>
(() => {
  const stages = {
    initial:['Menyiapkan aplikasi','Memeriksa penyimpanan dan menyiapkan layanan di perangkat Anda.',0],
    media:['Menyiapkan layanan kamera','Mengaktifkan layanan video untuk kamera Anda.',0],
    backend:['Menyiapkan data lokal','Menunggu layanan data dan pemrosesan siap digunakan.',0],
    frontend:['Menyiapkan ruang kerja','Memuat tampilan dan memeriksa kesiapan aplikasi.',0],
    session:['Memeriksa sesi pengguna','Memulihkan sesi masuk yang tersimpan dengan aman.',1],
    interface:['Membuka Visitor Counter','Layanan sudah siap. Menghubungkan ke ruang kerja Anda.',2],
    failed:['Aplikasi belum dapat dimulai','Tutup aplikasi lalu buka kembali. Jika masalah berulang, periksa log aplikasi di folder data Visitor Counter.',-1]
  };
  const started=Date.now();let failed=false;
  window.setStartupStage = stage => {
    const state=stages[stage];if(!state)return;
    failed=stage==='failed';
    document.getElementById('startup').classList.toggle('failed',failed);
    document.getElementById('startup').setAttribute('aria-busy',String(!failed));
    document.getElementById('status').textContent=state[0];
    document.getElementById('description').textContent=state[1];
    ['services','session','interface'].forEach((name,index)=>{document.getElementById('step-'+name).className=index===state[2]?'active':index<state[2]?'done':'';});
    if(failed)document.getElementById('hint').textContent='Data lokal Anda tetap tersimpan.';
  };
  setInterval(()=>{if(failed)return;const seconds=Math.floor((Date.now()-started)/1000);document.getElementById('elapsed').textContent=seconds+' detik';if(seconds>=30)document.getElementById('hint').textContent='Masih menyiapkan layanan. Mohon tunggu.';},1000);
})();
</script>
</body>
</html>
