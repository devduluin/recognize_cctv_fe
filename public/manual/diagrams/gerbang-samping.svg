<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 290" font-family="ui-monospace, Menlo, Consolas, monospace" role="img" aria-label="Tampak samping: kamera setinggi kepala dan terlalu dekat dibanding kamera di ketinggian 2,5 sampai 3,5 meter, menunduk 15 sampai 30 derajat, 4 sampai 6 meter dari zona hitung.">
  <defs>
    <marker id="gs-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1e2a33"/></marker>
  </defs>
  <rect width="860" height="290" fill="#ffffff"/>
  <!-- Left panel: current -->
  <text x="20" y="26" font-size="13" font-weight="600" fill="#b3312a">SEKARANG: terlalu rendah dan terlalu dekat</text>
  <line x1="20" y1="240" x2="410" y2="240" stroke="#1e2a33" stroke-width="1.5"/>
  <line x1="60" y1="240" x2="60" y2="160" stroke="#1e2a33" stroke-width="3"/>
  <rect x="56" y="152" width="26" height="14" rx="2" fill="#b3312a"/>
  <path d="M82 159 L230 90 L230 240 Z" fill="#b3312a" fill-opacity="0.12"/>
  <line x1="82" y1="159" x2="230" y2="90" stroke="#b3312a" stroke-dasharray="4 3"/>
  <line x1="82" y1="159" x2="230" y2="235" stroke="#b3312a" stroke-dasharray="4 3"/>
  <g fill="#1e2a33"><circle cx="160" cy="161" r="9"/><rect x="151" y="172" width="18" height="38" rx="4"/><rect x="152" y="210" width="6" height="30"/><rect x="162" y="210" width="6" height="30"/></g>
  <line x1="34" y1="240" x2="34" y2="160" stroke="#1e2a33" marker-start="url(#gs-a)" marker-end="url(#gs-a)"/>
  <text x="24" y="200" font-size="11" text-anchor="middle" fill="#1e2a33" transform="rotate(-90 24 200)">1,6 m</text>
  <line x1="60" y1="258" x2="160" y2="258" stroke="#1e2a33" marker-start="url(#gs-a)" marker-end="url(#gs-a)"/>
  <text x="110" y="276" font-size="11" text-anchor="middle" fill="#1e2a33">±1 m</text>
  <text x="250" y="116" font-size="12" fill="#b3312a">kaki terpotong,</text>
  <text x="250" y="132" font-size="12" fill="#b3312a">gerak buram,</text>
  <text x="250" y="148" font-size="12" fill="#b3312a">orang di belakang</text>
  <text x="250" y="164" font-size="12" fill="#b3312a">tertutup</text>
  <!-- divider -->
  <line x1="430" y1="20" x2="430" y2="275" stroke="#cfd6d9"/>
  <!-- Right panel: recommended (offset x by 440) -->
  <g transform="translate(440 0)">
    <text x="20" y="26" font-size="13" font-weight="600" fill="#d9611b">DISARANKAN: tinggi dan cukup jauh</text>
    <line x1="20" y1="240" x2="400" y2="240" stroke="#1e2a33" stroke-width="1.5"/>
    <rect x="276" y="80" width="44" height="160" fill="#1f7a8c" fill-opacity="0.12"/>
    <line x1="276" y1="80" x2="276" y2="240" stroke="#1f7a8c" stroke-dasharray="5 4"/>
    <line x1="320" y1="80" x2="320" y2="240" stroke="#1f7a8c" stroke-dasharray="5 4"/>
    <text x="298" y="74" font-size="11" text-anchor="middle" fill="#1f7a8c">zona hitung</text>
    <line x1="48" y1="240" x2="48" y2="90" stroke="#1e2a33" stroke-width="3"/>
    <rect x="48" y="82" width="28" height="14" rx="2" fill="#d9611b" transform="rotate(20 48 89)"/>
    <path d="M74 98 L400 170 L400 240 L170 240 Z" fill="#d9611b" fill-opacity="0.13"/>
    <line x1="74" y1="98" x2="400" y2="170" stroke="#d9611b" stroke-dasharray="4 3"/>
    <line x1="74" y1="98" x2="170" y2="240" stroke="#d9611b" stroke-dasharray="4 3"/>
    <g fill="#1e2a33"><circle cx="298" cy="161" r="9"/><rect x="289" y="172" width="18" height="38" rx="4"/><rect x="290" y="210" width="6" height="30"/><rect x="300" y="210" width="6" height="30"/></g>
    <line x1="330" y1="200" x2="372" y2="200" stroke="#1e2a33" marker-end="url(#gs-a)"/>
    <text x="351" y="193" font-size="10" text-anchor="middle" fill="#1e2a33">jalan</text>
    <line x1="26" y1="240" x2="26" y2="90" stroke="#1e2a33" marker-start="url(#gs-a)" marker-end="url(#gs-a)"/>
    <text x="16" y="165" font-size="11" text-anchor="middle" fill="#1e2a33" transform="rotate(-90 16 165)">2,5 – 3,5 m</text>
    <line x1="48" y1="258" x2="298" y2="258" stroke="#1e2a33" marker-start="url(#gs-a)" marker-end="url(#gs-a)"/>
    <text x="173" y="276" font-size="11" text-anchor="middle" fill="#1e2a33">4 – 6 m ke garis hitung</text>
    <path d="M96 90 A30 30 0 0 1 104 105" fill="none" stroke="#d9611b"/>
    <text x="110" y="94" font-size="11" fill="#d9611b">15° – 30°</text>
  </g>
</svg>
