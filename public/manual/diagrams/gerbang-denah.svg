<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" font-family="ui-monospace, Menlo, Consolas, monospace" role="img" aria-label="Denah gerbang: kamera masuk di dalam area menghadap gerbang, zona dua garis tegak lurus arah datang, kamera keluar opsional di luar menghadap ke dalam.">
  <defs>
    <marker id="gd-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1e2a33"/></marker>
    <marker id="gd-o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#d9611b"/></marker>
  </defs>
  <rect width="640" height="330" fill="#ffffff"/>
  <text x="20" y="28" font-size="12" fill="#5d6b74">LUAR AREA</text>
  <text x="20" y="318" font-size="12" fill="#5d6b74">DALAM AREA</text>
  <line x1="20" y1="110" x2="240" y2="110" stroke="#1e2a33" stroke-width="6"/>
  <line x1="400" y1="110" x2="620" y2="110" stroke="#1e2a33" stroke-width="6"/>
  <text x="320" y="132" font-size="11" text-anchor="middle" fill="#1e2a33">gerbang 3 – 4 m</text>
  <line x1="290" y1="40" x2="290" y2="96" stroke="#1e2a33" stroke-width="1.5" marker-end="url(#gd-a)"/>
  <line x1="350" y1="40" x2="350" y2="96" stroke="#1e2a33" stroke-width="1.5" marker-end="url(#gd-a)"/>
  <text x="370" y="66" font-size="11" fill="#1e2a33">orang datang</text>
  <rect x="200" y="150" width="240" height="34" fill="#1f7a8c" fill-opacity="0.12"/>
  <line x1="200" y1="150" x2="440" y2="150" stroke="#1f7a8c" stroke-width="2" stroke-dasharray="6 4"/>
  <line x1="200" y1="184" x2="440" y2="184" stroke="#1f7a8c" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="452" y="164" font-size="11" fill="#1f7a8c">garis 1</text>
  <text x="452" y="188" font-size="11" fill="#1f7a8c">garis 2</text>
  <text x="190" y="171" font-size="11" text-anchor="end" fill="#1f7a8c">zona hitung</text>
  <line x1="180" y1="114" x2="180" y2="148" stroke="#1e2a33" marker-start="url(#gd-a)" marker-end="url(#gd-a)"/>
  <text x="172" y="134" font-size="10" text-anchor="end" fill="#1e2a33">≥ 1,5 m tampak utuh</text>
  <path d="M320 290 L200 116 L440 116 Z" fill="#d9611b" fill-opacity="0.10"/>
  <line x1="320" y1="290" x2="200" y2="116" stroke="#d9611b" stroke-dasharray="4 3"/>
  <line x1="320" y1="290" x2="440" y2="116" stroke="#d9611b" stroke-dasharray="4 3"/>
  <rect x="308" y="286" width="24" height="16" rx="2" fill="#d9611b"/>
  <text x="344" y="298" font-size="12" font-weight="600" fill="#d9611b">Kamera MASUK</text>
  <text x="344" y="313" font-size="10" fill="#5d6b74">di dinding/tiang, menghadap gerbang</text>
  <line x1="320" y1="250" x2="320" y2="196" stroke="#d9611b" marker-end="url(#gd-o)"/>
  <text x="314" y="232" font-size="10" text-anchor="end" fill="#d9611b">arah lensa</text>
  <rect x="20" y="44" width="24" height="16" rx="2" fill="none" stroke="#1e2a33" stroke-dasharray="3 2"/>
  <text x="52" y="56" font-size="11" fill="#1e2a33">Kamera KELUAR (opsional)</text>
  <text x="52" y="70" font-size="10" fill="#5d6b74">di luar, menghadap ke dalam</text>
  <line x1="560" y1="230" x2="560" y2="130" stroke="#1e2a33" stroke-dasharray="3 3" marker-end="url(#gd-a)"/>
  <text x="552" y="250" font-size="10" text-anchor="middle" fill="#5d6b74">jalur keluar</text>
  <text x="552" y="263" font-size="10" text-anchor="middle" fill="#5d6b74">terpisah bila bisa</text>
</svg>
